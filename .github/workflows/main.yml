
name: Refresh theme radar and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '30 22 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test dashboard rendering
        run: node --test tests/test_dashboard.cjs

      - name: Update market data
        run: python scripts/update_v4.py

      - name: Validate ETF signal data and stamp deployment
        env:
          BUILD_SHA: ${{ github.sha }}
        run: python scripts/validate_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
